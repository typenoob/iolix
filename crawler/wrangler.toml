#:schema ../node_modules/wrangler/config-schema.json

# 独立 Cron Worker：Pages Functions 不支持 scheduled handler，因此爬取逻辑单独部署。
# 与 Pages 项目共用同一个 KV namespace（binding 名同为 MOVIE_DB）。
name = "iolix-crawler"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
# 每天 UTC 02:00（北京时间 10:00）跑一次
# 注意：这里是 cron 的唯一来源，每次部署都会覆盖 Dashboard 上手动改的 Cron Trigger
crons = ["0 2 * * *"]

[[kv_namespaces]]
binding = "MOVIE_DB"
id = "d85295d9f56c40c5af00c426d7aad334"

[vars]
BATCH_SIZE = "60"
MAX_ID = "15000"
# 单次运行连续跑多批，直到无新 ID / 达到批数上限 / 超过时间预算
# 上限受 Workers 单次调用 1000 个子请求限制约束：12 批 × 60 个上游请求 + 3 次 KV 仍有余量
MAX_BATCHES = "12"
TIME_BUDGET_MS = "45000"
API_BASE = "http://fx.meiying.cool/api/"
PLAY_BASE = "http://fx.meiying.cool/"
